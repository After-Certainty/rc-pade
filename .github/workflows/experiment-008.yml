name: experiment-008-rc-field-projection

on:
  pull_request:
    paths:
      - 'experiments/008-rc-field-projection/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/experiment-008.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-field-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Run Experiment 008
        env:
          RC_PADE_EXPERIMENT_WORK: ${{ runner.temp }}/rc-pade-experiment-008
        run: bash experiments/008-rc-field-projection/run.sh
      - name: Upload generated experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-008-generated-artifacts
          if-no-files-found: warn
          path: experiments/008-rc-field-projection/generated/
