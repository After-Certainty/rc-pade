name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - run: go test ./...
      - name: Verify example projection
        run: |
          go run ./cmd/rc-pade generate \
            --profile examples/s3-put-object/runtime-conditions.yaml \
            --policy examples/s3-put-object/policy.yaml \
            | diff -u examples/s3-put-object/expected-pade.yaml -
      - name: Verify pinned Runtime Conditions profiler projection
        run: |
          go run ./cmd/rc-pade generate \
            --profile experiments/002-real-rc-profile/runtime-conditions.yaml \
            --policy examples/s3-put-object/policy.yaml \
            | diff -u experiments/002-real-rc-profile/expected-pade.yaml -
