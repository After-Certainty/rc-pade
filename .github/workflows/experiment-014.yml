name: experiment-014-signed-validation-handoff

on:
  pull_request:
    paths:
      - 'experiments/014-signed-validation-handoff/producer-bundle/**'
      - 'experiments/014-signed-validation-handoff/verify-producer-bundle.sh'
      - '.github/workflows/experiment-014.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/014-signed-validation-handoff/producer-bundle/**'
      - 'experiments/014-signed-validation-handoff/verify-producer-bundle.sh'
      - '.github/workflows/experiment-014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-producer-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - name: Check shell syntax
        run: bash -n experiments/014-signed-validation-handoff/verify-producer-bundle.sh
      - name: Verify recorded public producer bundle
        env:
          RC_PADE_EXPERIMENT_WORK: ${{ runner.temp }}/rc-pade-experiment-014
          GOTOOLCHAIN: auto
        run: bash experiments/014-signed-validation-handoff/verify-producer-bundle.sh
