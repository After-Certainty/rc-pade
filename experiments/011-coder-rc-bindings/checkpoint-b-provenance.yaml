    purpose: fresh trusted validation of exact Profile bytes before adapter consumption
    legs:
      s3LiveProfile:
        result: rejected-by-trusted-validator
        profile:
          path: ~/.config/pade/rc-downstream/profile.yaml
          source: examples/s3-put-object/runtime-conditions.yaml
          bytes: 282
          sha256: 0f797117993eb198548046f7c3458ee43d7bcb6f827b0e2086a77a415fba4804
        rcvalidate:
          exit: 1
          accepted: false
          reportedSha256: 0f797117993eb198548046f7c3458ee43d7bcb6f827b0e2086a77a415fba4804
          hashBoundToFileBytes: true
          stderr: 'conditions[0] (aws.s3/bucket): unknown kind "aws.s3"'
          declaredExtensions: []
          resolvedExtensions: []
        freshReportPath: ~/.config/pade/rc-downstream/validation-report.fresh.yaml
        priorAdapterShapedReportUntouched: true
        boundary: |
          Upstream rc-extension-resolver (009 pins) does not know kind aws.s3.
          Live S3 fulfillment still depends on adapter-shaped evidence, not a
          fresh trusted validation gate opening for those Profile bytes.
          Acceptance was not forged.

      caseAGitHubProfile:
        result: accepted
        composePins:
          rcDemos:
            repository: https://github.com/ksteffe/rc-demos.git
            commit: 13a85bd4221797c94e209fad576a9d4ab89522f3
          goRcProfiler:
            repository: https://github.com/runtimeconditions/go-rc-profiler.git
            commit: 5d2e860e48842b89ec83414123a7e59228f61d36
          extensions:
            commit: 7a08c8b9cc298c2c4a84b32d7cad2c3d813f97a7
        profile:
          path: .work/experiment-011-checkpoint-b/case-a/composed.profile.yaml
          name: web-demo-dev-container
          bytes: 1682
          sha256: 53fe0bca5664c9b889304c881d6643cec163f449a9d02a91fd5a6d635ad62e19
          matchesExperiment009CaseA: true
        conditions:
          - {index: 0, name: content-api, kind: api, interfaceType: http, valid: true}
          - {index: 1, name: site-analytics, kind: google.analytics, interfaceType: web, valid: true}
          - {index: 2, name: application-source, kind: source_control, interfaceType: git, valid: true}
        rcvalidate:
          exit: 0
          accepted: true
          reportedSha256: 53fe0bca5664c9b889304c881d6643cec163f449a9d02a91fd5a6d635ad62e19
          hashBoundToFileBytes: true
        freshReportPath: experiments/011-coder-rc-bindings/checkpoint-b/raw-validation-report.yaml
        continuesToB2: true

  B2:
    result: pass
    inputProfile: caseAGitHubProfile
    evidenceProjection:
      helper: experiments/011-coder-rc-bindings/project-validation-report.py
      method: |
        Deterministic field projection only: keep accepted, validator.module,
        validator.version, profile.sha256, profile.bytes, and each condition's
        index/kind/interfaceType/valid. Drop adapter-unknown extras from the
        fresh rcvalidate report (validator.scope, profile.path,
        profile.declaredExtensions, resolvedExtensions, conditions[].name).
        Fixed YAML layout in the helper so projected bytes are reproducible.
        Does not forge acceptance or loosen the adapter KnownFields decoder.
      rawReport:
        path: experiments/011-coder-rc-bindings/checkpoint-b/raw-validation-report.yaml
        sha256: 6be41940700b4821ec56202277e22f59a81c263e907c967ceb24b61571232706
