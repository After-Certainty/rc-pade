    usedModulePADE_BINDINGSOnly: true
    bindingsPath: /home/ksteffe/.config/pade/coder-bindings.yaml
    noTmpBindingsOverride: true
    developmentSessionFile: .work/experiment-011-checkpoint-b/b2-stage/development-session.yaml
    github:
      github.repo.read:
        result: authorized
        probe: After-Certainty/after-certainty
        childObservation: "repo_full_name=After-Certainty/after-certainty"
        tokenPresentInChildOnly: true
        tokenValueRecorded: false
      github.repo.write:
