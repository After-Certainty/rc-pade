        consumedByAdapter: true
      forgedAcceptance: false
      profileHashPreserved: true
      helperReproducesProjectedBytes: true
    policy: experiments/008-rc-field-projection/policy.yaml
    allowCapabilities: [github.repo.read, github.repo.write]
    brokerBindingSource: ~/.config/pade/rc-downstream/broker_binding.json
    adapterStdout: "experiment-011: wrote 2 broker-only capability bindings"
    output: /home/ksteffe/.config/pade/coder-bindings.yaml
    mode0600: true
    capabilityNames: [github.repo.read, github.repo.write]
    allBrokerBound: true
    noCredentialMaterialInBindings: true
    priorCapabilitiesReplaced: [aws.s3.bucket.write]
    profileShaStillBound: 53fe0bca5664c9b889304c881d6643cec163f449a9d02a91fd5a6d635ad62e19
    stagedUnder: .work/experiment-011-checkpoint-b/b2-stage/

  B3:
