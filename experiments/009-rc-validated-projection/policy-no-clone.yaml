# Experiment 009 case C policy.
#
# Identical to experiments/008-rc-field-projection/policy.yaml except that the
# `clone` project clause is removed, so this operator policy does not support
# `clone` even though the source-control extension defines it. `cover` is kept,
# so an uncovered access value still fails closed instead of being dropped.
apiVersion: rc-pade.local/v1alpha1
kind: ProjectionPolicy
rules:
  - match:
      kind: api
      interfaceType: http
    outsidePADE: true
  - match:
      kind: google.analytics
      interfaceType: web
    outsidePADE: true
  - match:
      kind: source_control
      interfaceType: git
    require:
      - path: interface.provider
        equals: github
    project:
      - when:
          - path: interface.access
            contains: fetch
        capability: github.repo.read
        access: read
      - when:
          - path: interface.access
            contains: pull
        capability: github.repo.read
        access: read
      - when:
          - path: interface.access
            contains: push
        capability: github.repo.write
        access: write
    cover:
      - interface.access
