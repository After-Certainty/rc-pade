seamReplacement:
  preserved:
    - signed handoff materialization
    - trusted.pub / policy.yaml / allow-capabilities.txt
    - handoff.Verify → verified-profile.yaml
    - module.pade dynamic mode / broker_binding / bindings_path / scripts
    - GCE workload identity and deployed broker endpoint variable
    - fail-closed empty bindings on verify failure
  removedFromActivePath:
    - experiments/011-coder-rc-bindings fetch/build/run
    - validation-report.yaml embed and materialization
    - --validation-report
    - success-path binding writes from the verify script
  added:
    - coder_script.rc_handoff_verify sync after-certainty-rc-trusted-bindings (verify only)
    - coder_script.rc_pade_install sync after-certainty-rc-pade-install → ~/.local/bin/rc-pade
    - module.rc_pade_bindings @ c40ba8c invoking rc-pade bind --verified-profile

syncGraph:
  verify:
    name: after-certainty-rc-trusted-bindings
    waitsOn: module.pade.scripts
    completesAfter: verified-profile.yaml written
  install:
    name: after-certainty-rc-pade-install
    waitsOn: none
    completesAfter: ~/.local/bin/rc-pade executable with bind subcommand
  bind:
    name: after-certainty-rc-pade-bindings
    waitsOn:
      - module.pade.scripts
      - after-certainty-rc-trusted-bindings
      - after-certainty-rc-pade-install
    invokes: rc-pade bind --verified-profile ...

staticAssertionsBeforePush:
  result: pass
  requiredPresent:
    - module "rc_pade_bindings"
    - verified_profile_path / policy_path / allow_capabilities
    - broker_binding / bindings_path / pade_scripts from module.pade
    - prerequisite sync names after-certainty-rc-trusted-bindings and after-certainty-rc-pade-install
    - rc_pade_command ~/.local/bin/rc-pade
    - verify script waits on module.pade.scripts
    - modules/rc-pade-bindings bind.sh.tftpl contains rc-pade bind --verified-profile
  forbiddenAbsentFromActivePath:
    - experiments/011-coder-rc-bindings
    - --validation-report
    - rc_input_report_b64
    - validation-report.yaml file in template tree
  note: |
    Template comments may mention validation-report.yaml only for stale-file
    cleanup after prior Experiment 014 workspace homes. No report is embedded
    or required for binding.

