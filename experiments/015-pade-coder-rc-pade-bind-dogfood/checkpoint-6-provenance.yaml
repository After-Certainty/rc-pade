whatSuccessProves: |
  A real GCE-backed Coder lifecycle can use the current reusable boundaries:

    trusted signed RC handoff
            ↓
    verified Profile bytes
            ↓
    pade-coder optional bindings module
            ↓
    rc-pade bind
            ↓
    module-managed PADE bindings
            ↓
    PADE v0.4.1
            ↓
    broker authorization

  with no active Experiment 011 adapter, no active validator-specific
  validation-report.yaml, no manual bindings staging, restart and fresh-home
  regeneration, fail-closed startup behavior, live read authorization, and
  live write denial.

whatSuccessDoesNotProve:
  - normative Runtime Conditions signing format
  - production signing-key lifecycle or PKI
  - production rc-pade distribution/update mechanism
  - universal Coder compatibility
  - support for every Runtime Conditions extension
  - that stock RC extension catalogs validate the Experiment 014 Case A Profile
    without its documented producer adaptation
  - that local PADE bindings grant authority
  - that PADE or pade-coder should own Runtime Conditions semantics
  - tamper-resistant / TOCTOU-free transfer of the exact verified Profile
    bytes from verifier to rc-pade bind (Coder sync orders the steps; the
    handoff remains workspace-local verified-profile.yaml, rewriteable by
    the same workspace user before bind re-opens it — orchestration
    handoff, not a security isolation boundary)

