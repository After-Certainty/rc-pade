chosenMechanism:
  name: extend-existing-coder_script.rc_trusted_bindings
  rationale: |
    Smallest reliable source-of-truth already in use. The template already
    materializes broker_binding from Terraform and fail-closes when other
    inputs are absent. Checkpoint 1 selects the same Coder/Terraform delivery
    path for the remaining operator-owned and pinned trusted inputs rather
    than introducing a general config/secret platform.
  requirements:
    - delivery through Coder/platform integration, not manual shell copy
    - repository-controlled workload content alone cannot rewrite policy or allowlist
    - broker coordinates still come only from module.pade.broker_binding
    - local materializations use restrictive permissions (0600)
    - failure to retrieve any required trusted input leaves PADE bindings empty
  notChosen:
    - unpinned clone of workspace rc-pade tip as operator policy source
    - SSH/manual restage into ~/.config/pade/rc-downstream/
    - general-purpose secret/config distribution platform

stopCondition:
  ambiguityBetweenWorkloadDemandAndOperatorPolicy: false
  verdict: continue
  note: |
    Profile remains portable workload demand. Policy and allowlist remain
    operator-owned and template-controlled. Broker binding remains module
    output. No Checkpoint 1 stop.

